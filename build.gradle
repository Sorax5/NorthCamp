plugins {
    id 'java'
    alias(libs.plugins.shadow)
}

group = 'fr.phylisiumstudio'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://oss.sonatype.org/content/repositories/releases/' }
    maven { url 'https://repo.hypera.dev/snapshots/' } // spark-minestom
    maven { url 'https://repo.lucko.me/' }             // spark-common
}

dependencies {
    implementation libs.minestom
    implementation libs.maestro
    implementation libs.logback.classic
    implementation libs.configurate.yaml
    implementation libs.guice
    implementation libs.guava
    implementation libs.joml
    implementation libs.schem
    implementation libs.gdx.ai
    implementation libs.spark.minestom
    implementation libs.bundles.jackson

    compileOnly libs.lombok
    annotationProcessor libs.lombok
    testCompileOnly libs.lombok
    testAnnotationProcessor libs.lombok

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

def sharedJvmArgs = [
        '--add-opens', 'java.base/sun.misc=ALL-UNNAMED',
        '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
        '--enable-native-access=ALL-UNNAMED',
        '--sun-misc-unsafe-memory-access=allow'
]

tasks.withType(JavaExec).configureEach {
    jvmArgs sharedJvmArgs
}

tasks.named('test', Test) {
    useJUnitPlatform()
    jvmArgs sharedJvmArgs
}

tasks.named('jar', Jar) {
    manifest {
        attributes(
                'Main-Class': 'fr.phylisiumstudio.Main',
                'Add-Opens': 'java.base/sun.misc java.base/java.lang'
        )
    }
}

tasks.named('shadowJar') {
    mergeServiceFiles()
    archiveClassifier.set('')
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}
